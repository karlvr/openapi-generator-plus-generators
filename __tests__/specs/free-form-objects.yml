openapi: 3.0.3
info:
  title: Free-form objects
  version: '1.0'
paths:
  /blocks:
    get:
      operationId: getBlocks
      responses:
        '200':
          description: Blocks with free-form payloads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
components:
  schemas:
    Block:
      type: object
      required: [id]
      properties:
        id:
          type: string
        content:
          type: object
          description: A payload whose shape the specification does not describe
        attributes:
          type: object
          nullable: true
          additionalProperties: true
    EmptyObject:
      type: object
